name: Verify
on: [push, pull_request]
permissions:
  contents: read

jobs:
  matrix-tests:
    name: Core Matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Node.js unit tests
        run: npm test
      - name: Verify native Windows socket discovery without parallel test load
        if: runner.os == 'Windows'
        run: node tools/check-windows-discovery.mjs
      - name: Stream an optional transcript without retaining its text
        run: node --expose-gc tools/check-transcript-resources.mjs
      - name: Stream a synthetic corpus above the former 512 MiB cap
        run: node --expose-gc tools/check-trajectory-resources.mjs 640 1024
      - name: Reject over-budget projected statistics without partial cache
        run: node --expose-gc tools/check-trajectory-resources.mjs 0 32768 --expect-budget-rejection
      - name: Run IDE adapter tests
        run: node --test ide/tests/*.test.mjs
      - name: Run Python lifecycle and packaging tests
        run: python -m unittest discover -s tests -v
      - name: Update through real worker processes from the host working directory
        run: npm run test:update-process
      - name: Package desktop archive
        run: python manage.py package
      - name: Package IDE VSIX
        run: python ide/package.py
      - name: Upload distribution packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: antigrative-dashboard-dist
          path: dist/*

  ui-verification:
    name: Headless Browser UI Verification
    needs: matrix-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Shared Webview UI regressions
        run: npm run test:ui
      - name: IDE Webview UI regressions
        run: node tools/check-ide-ui.mjs
      - name: Usage dashboard regressions
        run: npm run test:usage-ui
      - name: Sidecar panel regressions
        run: npm run test:panel-ui
