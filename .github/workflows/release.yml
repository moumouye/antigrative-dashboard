name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  host-resources:
    uses: ./.github/workflows/host-resources.yml
    permissions:
      contents: read
  verify:
    name: Core Matrix (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Node.js unit tests
        run: npm test
      - name: Verify native Windows socket discovery without parallel test load
        if: runner.os == 'Windows'
        run: node tools/check-windows-discovery.mjs
      - name: Stream an optional transcript without retaining its text
        run: node --expose-gc tools/check-transcript-resources.mjs
      - name: Stream a synthetic corpus above the former 512 MiB cap
        run: node --expose-gc tools/check-trajectory-resources.mjs 640 1024
      - name: Reject over-budget projected statistics without partial cache
        run: node --expose-gc tools/check-trajectory-resources.mjs 0 32768 --expect-budget-rejection
      - name: Run IDE adapter tests
        run: node --test ide/tests/*.test.mjs
      - name: Run Python lifecycle and packaging tests
        run: python -m unittest discover -s tests -v
      - name: Update through real worker processes from the host working directory
        run: npm run test:update-process
      - name: Package desktop archive
        run: python manage.py package
      - name: Package IDE VSIX
        run: python ide/package.py
  ui-verification:
    name: Headless Browser UI Verification
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright/package.json') }}
      - name: Install Chromium browser & verify shared libraries
        run: |
          npx playwright install chromium
          if ! node -e "import('playwright').then(async ({chromium}) => { const b = await chromium.launch({headless: true}); await b.close(); })"; then
            sudo rm -f /etc/apt/sources.list.d/*microsoft* || true
            npx playwright install-deps chromium
          fi
      - name: Run parallel Playwright UI regression gates
        run: node tools/run-ui-gates.mjs all
  release:
    needs: [verify, ui-verification, host-resources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version
        run: |
          python -c "import json, os; v=json.load(open('plugin.json'))['version']; assert os.environ['GITHUB_REF_NAME']==f'v{v}', f'Tag and plugin version differ ({v})'"
      - name: Publish text-only release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish-release.py --text-only
